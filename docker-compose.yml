services:
  dockit:
    image: ghcr.io/jmm1960/dockit:latest
    restart: unless-stopped
    environment:
      TZ: UTC
      DOCKIT_UPDATE_CRON: "0 4 * * *"
      DOCKIT_BARK_SERVER: https://api.day.app
      DOCKIT_BARK_KEY: ${BARK_KEY:-}
      DOCKIT_BARK_GROUP: Dockit
      # Uncomment for Docker Engine 29 with the current Docker client.
      # DOCKER_API_VERSION: "1.44"
    labels:
      dockit.self: "true"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
