name: Clean unused container versions

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Preview deletions without changing the package
        type: boolean
        default: true
      minimum_age_minutes:
        description: Minimum age of unused versions (use 0 after publication has finished)
        type: number
        default: 60

permissions:
  contents: read
  packages: write

concurrency:
  group: cleanup-container-versions
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Preserve tagged images and remove unused manifests
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
          MINIMUM_AGE_MINUTES: ${{ inputs.minimum_age_minutes }}
        run: python3 .github/scripts/cleanup_images.py
